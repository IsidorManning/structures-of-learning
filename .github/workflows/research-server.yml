name: Research publication server

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: research-${{ github.event_name == 'pull_request' && github.ref || 'synchronize' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install literature metadata parser
        run: python -m pip install -r scripts/requirements-literature.txt

      - name: Test the converter
        run: python -m unittest discover -s tests -v

      - name: Validate the server snapshot
        run: python scripts/export_notes.py --source . --check

      - name: Check out incoming notes
        if: "!contains(github.event.head_commit.message, 'Infrastructure-Deployment: true')"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .build/incoming
          persist-credentials: false

      - name: Validate incoming notes
        if: "!contains(github.event.head_commit.message, 'Infrastructure-Deployment: true')"
        run: python scripts/export_notes.py --source .build/incoming --check

  synchronize:
    needs: render
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, 'Infrastructure-Deployment: true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out research
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install literature metadata parser
        run: python -m pip install -r scripts/requirements-literature.txt

      - name: Reconcile both branches and publish atomically
        shell: bash
        run: |
          git fetch origin main source
          python scripts/synchronize_research.py \
            --repository . \
            --source-ref origin/source \
            --public-ref origin/main \
            --push 2>&1 | tee "${RUNNER_TEMP}/research-sync.log"

      - name: Report synchronization failure
        if: failure()
        run: |
          echo '## Research synchronization stopped' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the failed step and conflict report. Synchronization never force-pushes either branch.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${RUNNER_TEMP}/research-sync.log" ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "${RUNNER_TEMP}/research-sync.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep conflict report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-sync-report
          path: ${{ runner.temp }}/research-sync.log
          if-no-files-found: ignore

